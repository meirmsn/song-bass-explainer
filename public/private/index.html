<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Private Catalog — Bass Study</title>
  <style>
    :root { color-scheme: dark; --bg:#0b0f14; --panel:#111827; --border:#374151; --text:#e5e7eb; --muted:#9ca3af; --primary:#3b82f6; --ok:#22c55e; --bad:#ef4444; --warn:#f59e0b; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100dvh; }
    main { max-width: 48rem; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
    h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
    .muted { color: var(--muted); font-size: .9rem; }
    .card { border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.1rem; background: var(--panel); margin-top: 1rem; }
    label { display: block; font-size: .8rem; font-weight: 600; color: var(--muted); margin-bottom: .35rem; }
    input[type=url], input[type=text] {
      width: 100%; padding: .7rem .75rem; border-radius: 8px; border: 1px solid var(--border);
      background: #0b0f14; color: var(--text); font-size: 1rem;
    }
    .row { display: flex; gap: .5rem; margin-top: .75rem; flex-wrap: wrap; }
    button {
      min-height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--primary); color: #fff; font-weight: 600; cursor: pointer;
    }
    button.secondary { background: #1f2937; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    pre { white-space: pre-wrap; word-break: break-word; font-size: .75rem; background: #0b0f14; border-radius: 8px; padding: .75rem; border: 1px solid var(--border); max-height: 220px; overflow: auto; }
    .jobs { margin-top: 1rem; display: grid; gap: .75rem; }
    .job { border: 1px solid var(--border); border-radius: 8px; padding: .8rem .9rem; background: #0b0f14; }
    .job .id { font-family: ui-monospace, monospace; font-size: .75rem; color: var(--muted); }
    .status { font-weight: 700; font-size: .85rem; }
    .status.queued { color: var(--warn); }
    .status.running { color: var(--primary); }
    .status.waiting_bot { color: #a855f7; }
    .status.ready, .status.done { color: var(--ok); }
    .status.failed { color: var(--bad); }
    a { color: #93c5fd; }
    .pipeline { display: flex; flex-wrap: wrap; gap: 4px; margin-top: .55rem; }
    .pip {
      font-size: 10px; font-weight: 700; letter-spacing: .02em; text-transform: uppercase;
      padding: 3px 7px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted);
    }
    .pip.done { background: #14532d; border-color: #16a34a; color: #bbf7d0; }
    .pip.active { background: #1e3a8a; border-color: var(--primary); color: #bfdbfe; }
    .pip.fail { background: #7f1d1d; border-color: var(--bad); color: #fecaca; }
    .err { color: #fca5a5; font-size: .75rem; margin-top: .35rem; }
  </style>
</head>
<body>
  <main>
    <h1>Private catalog</h1>
    <p class="muted">Paste a YouTube URL to enqueue OSS audio processing into <code>bass-private</code>. Box hybrid consumer polls queued jobs. Protected by Cloudflare Access.</p>

    <div class="card">
      <form id="intake">
        <label for="url">YouTube URL</label>
        <input id="url" name="url" type="url" required placeholder="https://www.youtube.com/watch?v=…" autocomplete="off" />
        <label for="title" style="margin-top:.75rem">Optional title</label>
        <input id="title" name="title" type="text" placeholder="Song title (optional)" />
        <div class="row">
          <button type="submit" id="submit">Enqueue job</button>
          <button type="button" class="secondary" id="refresh">Refresh</button>
          <a href="/private/player/" style="align-self:center;font-size:.9rem">Private player (Mute Bass)</a>
          <a href="/" style="align-self:center;font-size:.9rem">← Public visual demo</a>
        </div>
      </form>
      <p id="msg" class="muted" style="margin:.75rem 0 0"></p>
    </div>

    <div class="card">
      <strong>Recent jobs</strong>
      <div id="jobs" class="jobs"><p class="muted">Loading…</p></div>
    </div>

    <div class="card">
      <strong>Wake markers</strong>
      <pre id="wakes">…</pre>
    </div>

    <div class="card">
      <strong>Pipeline health</strong>
      <pre id="health">…</pre>
    </div>
  </main>
  <script>
    const STAGES = ["intake","download","demucs","beat","transcribe","procedural","wake","ready"];
    const msg = document.getElementById("msg");
    const jobsEl = document.getElementById("jobs");
    const healthEl = document.getElementById("health");
    const wakesEl = document.getElementById("wakes");

    function esc(s) {
      return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    function stageClass(job, name) {
      const st = (job.stages && job.stages[name]) || null;
      if (st && st.ok) return "done";
      if (job.status === "failed" && job.stage === name) return "fail";
      if (job.stage === name || (job.status === "running" && job.stage === name)) return "active";
      if (job.status === "waiting_bot" && name === "wake") return "active";
      if (job.status === "ready" && name === "ready") return "done";
      return "";
    }

    function renderPipeline(job) {
      return STAGES.map((s) => `<span class="pip ${stageClass(job, s)}">${s}</span>`).join("");
    }

    async function loadHealth() {
      try {
        const r = await fetch("/_health");
        healthEl.textContent = JSON.stringify(await r.json(), null, 2);
      } catch (e) { healthEl.textContent = String(e); }
    }

    async function loadWakes() {
      try {
        const r = await fetch("/private/api/wake");
        if (!r.ok) throw new Error(r.status + " " + await r.text());
        const data = await r.json();
        wakesEl.textContent = JSON.stringify(data.wakes || [], null, 2);
      } catch (e) {
        wakesEl.textContent = String(e);
      }
    }

    async function loadJobs() {
      try {
        const r = await fetch("/private/api/jobs");
        if (!r.ok) throw new Error(r.status + " " + await r.text());
        const data = await r.json();
        const list = data.jobs || [];
        if (!list.length) { jobsEl.innerHTML = '<p class="muted">No jobs yet.</p>'; return; }
        jobsEl.replaceChildren(...list.map((j) => {
          const d = document.createElement("div");
          d.className = "job";
          const title = esc(j.title || j.url || "");
          const err = j.lastError ? `<div class="err">${esc(j.lastError)}</div>` : "";
          const study = j.status === "waiting_bot" || j.status === "ready"
            ? `<div class="muted" style="font-size:.75rem;margin-top:.35rem"><a href="/private/api/jobs/${esc(j.id)}/study/resource.json">study/resource.json</a> · <a href="/private/api/jobs/${esc(j.id)}">meta+stages</a></div>`
            : `<div class="muted" style="font-size:.75rem;margin-top:.35rem"><a href="/private/api/jobs/${esc(j.id)}">details</a></div>`;
          d.innerHTML = `<div class="id">${esc(j.id)}</div>
            <div class="status ${esc(j.status)}">${esc(j.status)}</div>
            <div>${title}</div>
            <div class="muted" style="font-size:.75rem;margin-top:.25rem">${esc(j.updatedAt || j.createdAt || "")} · stage: ${esc(j.stage || "—")}</div>
            <div class="pipeline">${renderPipeline(j)}</div>
            ${err}${study}`;
          return d;
        }));
      } catch (e) {
        jobsEl.innerHTML = '<p class="muted">Jobs API: ' + esc(String(e)) + '</p>';
      }
    }

    document.getElementById("intake").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submit");
      btn.disabled = true; msg.textContent = "Submitting…";
      try {
        const body = { url: document.getElementById("url").value.trim(), title: document.getElementById("title").value.trim() || undefined };
        const r = await fetch("/private/api/jobs", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.error || r.statusText);
        msg.textContent = "Queued " + data.job.id + " — box consumer will pick it up.";
        document.getElementById("url").value = "";
        await loadJobs();
        await loadWakes();
      } catch (err) {
        msg.textContent = "Error: " + err.message;
      } finally { btn.disabled = false; }
    });
    document.getElementById("refresh").addEventListener("click", () => { loadJobs(); loadWakes(); loadHealth(); });
    loadHealth(); loadJobs(); loadWakes();
    setInterval(() => { loadJobs(); loadWakes(); }, 15000);
  </script>
</body>
</html>
