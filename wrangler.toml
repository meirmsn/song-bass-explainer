name = "bass-study"
main = "src/index.js"
compatibility_date = "2026-10-23"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[r2_buckets]]
binding = "DEMO_BUCKET"
bucket_name = "bass-demo"

[[r2_buckets]]
binding = "PRIVATE_BUCKET"
bucket_name = "bass-private"

